name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.13.5
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run tests with coverage gate
        run: uv run pytest
      - name: Audit dependencies
        run: |
          uv export --quiet --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Check formatting
        run: npm run lint
      - name: Run tests with coverage gate
        run: npm run test:coverage
      - name: Audit dependencies
        run: npm run audit
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [server, web]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install uv
        run: pip install uv==0.13.5
      - name: Install server dependencies
        run: uv sync --locked
        working-directory: server
      - name: Install web dependencies
        run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Build the web app
        run: npm run build
      - name: Run end-to-end tests against the real server
        run: npm run test:e2e
