name: Image

# Builds the Docker image on every pull request and runs it end to end in the Compose test
# stack. On a merge to main, the same image is pushed to the private
# ghcr.io/sirmeili/rollcall, tagged latest and with the commit (docs/deploy.md).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image (x86-64)
        run: docker build --platform linux/amd64 --tag rollcall:test .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.13.5
      - name: Install the test dependencies
        working-directory: server
        run: uv sync --locked
      - name: Run the image end to end in the Compose test stack
        working-directory: server
        run: uv run pytest tests/deploy --no-cov -v
        env:
          FT_COMPOSE_STACK: "1"
          ROLLCALL_IMAGE: rollcall:test
      - name: Show the stack's log if it failed
        if: failure()
        run: docker compose -f deploy/test/compose.yaml logs --no-color || true
      - name: Save the image for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save rollcall:test | gzip > "$RUNNER_TEMP/rollcall.tar.gz"
      - name: Keep the tested image for the publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rollcall-image
          path: ${{ runner.temp }}/rollcall.tar.gz
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only this job can write packages, and it runs only for main.
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-image
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rollcall-image
          path: ${{ runner.temp }}
      - name: Load the tested image
        run: gunzip -c "$RUNNER_TEMP/rollcall.tar.gz" | docker load
      - name: Log in to the GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push latest and the commit
        run: |
          for tag in latest "$GITHUB_SHA"; do
            docker tag rollcall:test "ghcr.io/sirmeili/rollcall:$tag"
            docker push "ghcr.io/sirmeili/rollcall:$tag"
          done
      - name: Log out
        if: always()
        run: docker logout ghcr.io
