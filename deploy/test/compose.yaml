# The end-to-end test stack (Testing in docs/SPEC.md): the RollCall image with a Mosquitto
# broker standing in for Home Assistant's. server/tests/deploy/test_compose_stack.py starts
# it, drives it with the scan simulator, and removes it with its volumes. Test values only.
name: rollcall-test
services:
  broker:
    image: eclipse-mosquitto:2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports:
      - "127.0.0.1:${TEST_BROKER_PORT:-21883}:1883"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883"]
      interval: 1s
      timeout: 2s
      retries: 30

  rollcall:
    image: ${ROLLCALL_IMAGE:-rollcall:test}
    depends_on:
      broker:
        condition: service_healthy
    environment:
      MQTT_URL: mqtt://broker:1883
      TZ: America/Chicago
      ADMIN_TOKEN: compose-test-admin-token-0123456789
      # The test signs in over plain HTTP.
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${TEST_PORT:-18000}:8000"
    volumes:
      - data:/data
      - backups:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Checked often, so the test does not wait long for "healthy".
      interval: 2s
      start_period: 30s

volumes:
  data:
  backups:
