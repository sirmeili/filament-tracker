<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity — RollCall</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.light{--bg:#F4F2EE;--surface:#FFFFFF;--line:#DDD8CF;--text:#1C1B19;--muted:#5E5A53;--accent:#B45309;--onaccent:#FFFFFF;--lowbg:#FDECD3;--lowtext:#7C3500;--chip:#ECE8E1;--ringShadow:0 1px 3px rgba(0,0,0,.22),0 4px 12px rgba(0,0,0,.16);--holeShadow:inset 0 1px 3px rgba(0,0,0,.18)}
.dark{--bg:#121212;--surface:#1C1C1B;--line:#34322E;--text:#F2EFE9;--muted:#A9A49B;--accent:#F59E0B;--onaccent:#1A1205;--lowbg:#3A2608;--lowtext:#FBBF5C;--chip:#262523;--ringShadow:0 0 0 1.5px var(--surface),0 0 0 2.5px rgba(255,255,255,.3),0 0 10px 2px rgba(255,255,255,.1);--holeShadow:inset 0 0 0 1.5px var(--surface),inset 0 0 0 2.5px rgba(255,255,255,.3),inset 0 0 6px 1px rgba(255,255,255,.1)}
.ring{display:inline-block;border-radius:50%;box-sizing:border-box;background:var(--bg);flex:none;box-shadow:var(--ringShadow),var(--holeShadow)}
.dark .ring.sm{box-shadow:0 0 0 1px var(--surface),0 0 0 1.75px rgba(255,255,255,.28),0 0 6px 1px rgba(255,255,255,.08),inset 0 0 0 1px var(--surface),inset 0 0 0 1.75px rgba(255,255,255,.28)}
.nav{padding:10px 14px;border-radius:8px;color:var(--muted);font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:8px;min-height:24px}
.nav:hover{background:var(--chip);color:var(--text)}
.nav.on{background:var(--text);color:var(--bg)}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.chip{font:inherit;font-size:14px;font-weight:600;padding:10px 16px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn{font:inherit;font-size:13px;font-weight:600;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 20px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ev{font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;border:1px solid transparent}
.ev.received{background:var(--text);color:var(--bg)}
.ev.opened{background:var(--chip);color:var(--text);border-color:var(--line)}
.ev.empty{color:var(--muted);border:1px dashed var(--muted)}
.ev.revert{color:var(--text);border:1px solid var(--line)}
.flag{background:var(--lowbg);color:var(--lowtext);font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em}
.struck{text-decoration:line-through;color:var(--muted)}
.src{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
</style>
</helmet>
<div class="{{theme}}" style="min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif">
<header style="border-bottom: 1px solid var(--line); background: var(--surface)">
<div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
<a href="Inventory.dc.html" style="display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em">
<svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="14" cy="14" r="11"></circle><circle cx="14" cy="14" r="4"></circle><path d="M14 3v4M14 21v4M3 14h4M21 14h4"></path></svg>
RollCall
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto">
<a class="nav" href="Inventory.dc.html">Inventory</a>
<a class="nav" href="Spools.dc.html">Spools</a>
<a class="nav" href="Products.dc.html">Products</a>
<a class="nav" href="Review.dc.html">Review <span style="background: var(--accent); color: var(--onaccent); border-radius: 999px; font-size: 12px; font-weight: 700; padding: 1px 7px">4</span></a>
<a class="nav on" href="Activity.dc.html" aria-current="page">Activity</a>
<a class="nav" href="Devices.dc.html">Devices</a>
<a class="nav" href="Users.dc.html">Users</a>
</nav>
<div style="display: flex; align-items: center; gap: 10px">
<button class="iconbtn" type="button" aria-label="{{themeLabel}}" onClick="{{toggleTheme}}">
<sc-if value="{{dark}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{light}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
</button>
<a href="Account.dc.html" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; border-radius: 10px; border: 1px solid var(--line); min-height: 26px; font-size: 14px; font-weight: 500"><span style="width: 26px; height: 26px; border-radius: 50%; background: var(--chip); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">F</span>frank</a>
</div>
</div>
</header>

<main style="max-width: 1000px; margin: 0 auto; padding: 32px 24px 56px; display: flex; flex-direction: column; gap: 24px">
<div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -0.02em">Activity</h1>
<p style="margin: 6px 0 0; color: var(--muted); font-size: 15px">Every event from scanners, the printer and the web app, newest first.</p>
</div>
<div role="group" aria-label="Filter by source" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{filters}}" as="t" hint-placeholder-count="4">
<button type="button" class="{{t.cls}}" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}">{{t.label}}</button>
</sc-for>
</div>

<sc-for list="{{days}}" as="d" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em">{{d.label}}</h2>
<div style="background: var(--surface); border: 1px solid var(--line); border-radius: 16px">
<sc-for list="{{d.items}}" as="e" hint-placeholder-count="3">
<div class="row">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted); width: 72px">{{e.time}}</span>
<span class="ring sm" aria-hidden="true" style="width: 28px; height: 28px; border: 8px solid {{e.hex}}"></span>
<a href="SpoolDetail.dc.html" style="flex: 1 1 220px; min-width: 0"><span class="{{e.nameCls}}" style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px">{{e.product}}</span> <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted)">#{{e.spool}}</span></a>
<span class="{{e.evCls}}">{{e.evLabel}}</span>
<sc-if value="{{e.flagged}}" hint-placeholder-val="{{false}}"><span class="flag">Flagged</span></sc-if>
<span class="src" style="width: 170px">{{e.by}}</span>
<span style="width: 72px; display: flex; justify-content: flex-end">
<sc-if value="{{e.canUndo}}" hint-placeholder-val="{{false}}"><button class="btn" type="button" onClick="{{e.undo}}">Undo</button></sc-if>
<sc-if value="{{e.isUndone}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: var(--muted)">Undone</span></sc-if>
</span>
</div>
</sc-for>
</div>
</section>
</sc-for>
<button class="chip" type="button" style="align-self: center">Load older</button>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":1150}}'>
var EVENTS = [
  { id: 1, day: 'Today', time: '9:30 AM', product: 'Blue TPU for AMS', hex: '5E9BD8', spool: 19, type: 'received', label: 'Tag linked', src: 'scanner', by: 'Workbench scanner', flagged: true, undoable: true },
  { id: 2, day: 'Today', time: '8:12 AM', product: 'Jade White PLA Basic', hex: 'FFFFFF', spool: 6, type: 'received', label: 'Received', src: 'scanner', by: 'Workbench scanner', undoable: true },
  { id: 3, day: 'Yesterday', time: '7:12 PM', product: 'Bambu Green PLA Basic', hex: '00AE42', spool: 10, type: 'empty', label: 'Used up', src: 'scanner', by: 'Workbench scanner', flagged: true, undoable: true },
  { id: 4, day: 'Yesterday', time: '6:50 PM', product: 'Blue TPU for AMS', hex: '5E9BD8', spool: 19, type: 'received', label: 'Received', src: 'web', by: 'frank (web)', undoable: true },
  { id: 5, day: 'Yesterday', time: '2:18 PM', product: 'Black PLA Basic', hex: '000000', spool: 3, type: 'empty', label: 'Used up', src: 'web', by: 'jordan (web)', undoable: true },
  { id: 6, day: 'Nov 3', time: '9:05 PM', product: 'Red PLA Basic', hex: 'C12E1F', spool: 17, type: 'opened', label: 'Opened', src: 'ams', by: 'P1S (AMS slot 3)', undoable: true },
  { id: 7, day: 'Nov 3', time: '8:41 PM', product: 'Cyan PLA Basic', hex: '0086D6', spool: 26, type: 'revert', label: 'Undo', src: 'scanner', by: 'Garage scanner' },
  { id: 8, day: 'Nov 3', time: '8:40 PM', product: 'Cyan PLA Basic', hex: '0086D6', spool: 26, type: 'empty', label: 'Used up', src: 'scanner', by: 'Garage scanner', reverted: true },
  { id: 9, day: 'Nov 3', time: '11:02 AM', product: 'Black PLA Basic', hex: '000000', spool: 2, type: 'received', label: 'Received', src: 'scanner', by: 'Workbench scanner', undoable: true }
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dark: null, src: 'all', undone: {} }; }
  renderVals() {
    var self = this;
    var dark = this.state.dark === null ? !!this.props.dark : this.state.dark;
    var undone = this.state.undone;
    var list = EVENTS.filter(function (e) { return self.state.src === 'all' || e.src === self.state.src; });
    var days = [];
    list.forEach(function (e) {
      var isUndone = !!e.reverted || !!undone[e.id];
      var item = {
        time: e.time, product: e.product, hex: '#' + e.hex, spool: e.spool, by: e.by, flagged: !!e.flagged && !isUndone,
        evCls: 'ev ' + e.type, evLabel: e.label, nameCls: isUndone ? 'struck' : '',
        canUndo: !!e.undoable && !isUndone, isUndone: isUndone,
        undo: function () { var n = Object.assign({}, self.state.undone); n[e.id] = true; self.setState({ undone: n }); }
      };
      var d = days[days.length - 1];
      if (!d || d.label !== e.day) { d = { label: e.day, items: [] }; days.push(d); }
      d.items.push(item);
    });
    var filters = [['all', 'All'], ['scanner', 'Scanners'], ['web', 'Web app'], ['ams', 'Printer']].map(function (p) {
      var on = self.state.src === p[0];
      return { label: p[1], cls: on ? 'chip on' : 'chip', pressed: on ? 'true' : 'false', pick: function () { self.setState({ src: p[0] }); } };
    });
    return {
      dark: dark, light: !dark, theme: dark ? 'dark' : 'light',
      themeLabel: dark ? 'Switch to light theme' : 'Switch to dark theme',
      toggleTheme: function () { self.setState({ dark: !dark }); },
      days: days, filters: filters
    };
  }
}
</script>
</body>
</html>
