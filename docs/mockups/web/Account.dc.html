<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account — RollCall</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.light{--bg:#F4F2EE;--surface:#FFFFFF;--line:#DDD8CF;--text:#1C1B19;--muted:#5E5A53;--accent:#B45309;--onaccent:#FFFFFF;--lowbg:#FDECD3;--lowtext:#7C3500;--chip:#ECE8E1}
.dark{--bg:#121212;--surface:#1C1C1B;--line:#34322E;--text:#F2EFE9;--muted:#A9A49B;--accent:#F59E0B;--onaccent:#1A1205;--lowbg:#3A2608;--lowtext:#FBBF5C;--chip:#262523}
.nav{padding:10px 14px;border-radius:8px;color:var(--muted);font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:8px;min-height:24px}
.nav:hover{background:var(--chip);color:var(--text)}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.btn{font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.input{font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;box-sizing:border-box;width:100%}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
</style>
</helmet>
<div class="{{theme}}" style="min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif">
<header style="border-bottom: 1px solid var(--line); background: var(--surface)">
<div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
<a href="Inventory.dc.html" style="display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em">
<svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="14" cy="14" r="11"></circle><circle cx="14" cy="14" r="4"></circle><path d="M14 3v4M14 21v4M3 14h4M21 14h4"></path></svg>
RollCall
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto">
<a class="nav" href="Inventory.dc.html">Inventory</a>
<a class="nav" href="Spools.dc.html">Spools</a>
<a class="nav" href="Products.dc.html">Products</a>
<a class="nav" href="Review.dc.html">Review <span style="background: var(--accent); color: var(--onaccent); border-radius: 999px; font-size: 12px; font-weight: 700; padding: 1px 7px">4</span></a>
<a class="nav" href="Activity.dc.html">Activity</a>
<a class="nav" href="Devices.dc.html">Devices</a>
<a class="nav" href="Users.dc.html">Users</a>
</nav>
<div style="display: flex; align-items: center; gap: 10px">
<button class="iconbtn" type="button" aria-label="{{themeLabel}}" onClick="{{toggleTheme}}">
<sc-if value="{{dark}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{light}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
</button>
<a href="Account.dc.html" aria-current="page" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; border-radius: 10px; border: 1px solid var(--text); background: var(--text); color: var(--bg); min-height: 26px; font-size: 14px; font-weight: 500"><span style="width: 26px; height: 26px; border-radius: 50%; background: var(--bg); color: var(--text); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">F</span>frank</a>
</div>
</div>
</header>

<main style="max-width: 640px; margin: 0 auto; padding: 32px 24px 56px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; gap: 18px">
<span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 50%; background: var(--chip); display: inline-flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700">F</span>
<div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 700; letter-spacing: -0.02em">frank</h1>
<p style="margin: 4px 0 0; color: var(--muted); font-size: 15px">Admin · signed in since Nov 5, 4:39 PM</p>
</div>
</div>

<section class="card" aria-labelledby="pw-h">
<h2 id="pw-h" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">Change password</h2>
<label class="field">Current password<input class="input" type="password" autocomplete="current-password"></label>
<label class="field">New password<input class="input" type="password" autocomplete="new-password" onInput="{{onPw}}"></label>
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted)">
<div style="flex: 1; height: 6px; border-radius: 999px; background: var(--chip); overflow: hidden"><span style="display: block; height: 100%; width: {{pwWidth}}; background: var(--text); border-radius: 999px"></span></div>
<span>{{pwText}}</span>
</div>
<label class="field">Confirm new password<input class="input" type="password" autocomplete="new-password"></label>
<p style="margin: 0; font-size: 13px; color: var(--muted)">At least 12 characters. Changing it signs you out everywhere else.</p>
<button class="btn primary" type="button" style="align-self: flex-start">Change password</button>
</section>

<section class="card" aria-labelledby="so-h" style="flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between">
<div><h2 id="so-h" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">Sign out</h2><p style="margin: 4px 0 0; font-size: 14px; color: var(--muted)">Ends this session on this device.</p></div>
<a class="btn" href="SignIn.dc.html">Sign out</a>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dark: null, len: 0 }; }
  renderVals() {
    var self = this;
    var dark = this.state.dark === null ? !!this.props.dark : this.state.dark;
    var len = this.state.len;
    return {
      dark: dark, light: !dark, theme: dark ? 'dark' : 'light',
      themeLabel: dark ? 'Switch to light theme' : 'Switch to dark theme',
      toggleTheme: function () { self.setState({ dark: !dark }); },
      onPw: function (e) { self.setState({ len: e && e.target ? e.target.value.length : 0 }); },
      pwWidth: Math.min(100, Math.round(len / 12 * 100)) + '%',
      pwText: len >= 12 ? 'Long enough' : (12 - len) + ' more characters'
    };
  }
}
</script>
</body>
</html>
