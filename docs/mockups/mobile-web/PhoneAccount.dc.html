<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone — Account with Appearance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.light{--bg:#F4F2EE;--surface:#FFFFFF;--line:#DDD8CF;--text:#1C1B19;--muted:#5E5A53;--accent:#B45309;--onaccent:#FFFFFF;--chip:#ECE8E1}
.dark{--bg:#121212;--surface:#1C1C1B;--line:#34322E;--text:#F2EFE9;--muted:#A9A49B;--accent:#F59E0B;--onaccent:#1A1205;--chip:#262523}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--chip)}
.sbtn{font:inherit;font-size:14px;font-weight:600;min-height:64px;border:0;border-radius:11px;background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.sbtn.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.rowlink{display:flex;align-items:center;gap:12px;min-height:52px;font-size:16px;font-weight:600;border-top:1px solid var(--line)}
.rowlink:first-of-type{border-top:0}
.btn{font:inherit;font-size:16px;font-weight:600;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bb{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:8px 14px 22px;background:var(--surface);border-top:1px solid var(--line)}
.bbtn{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:48px;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
.bbtn.on{color:var(--text)}
.scan{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:-30px;font-size:12px;font-weight:700;color:var(--text)}
.scan .fab{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--onaccent);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px var(--surface),0 4px 14px rgba(0,0,0,.25)}
</style>
</helmet>
<div class="{{themeCls}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; gap: 10px; padding: 18px 20px 10px">
<svg width="30" height="30" viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="62" fill="#C8324B"></circle><circle cx="70" cy="70" r="50" fill="none" stroke="#FFF7F5" stroke-width="2" opacity="0.45"></circle><circle cx="70" cy="70" r="40" fill="none" stroke="#FFF7F5" stroke-width="2" opacity="0.45"></circle><circle cx="70" cy="70" r="30" fill="#FFF7F5"></circle><polyline points="56,71 66,81 85,60" fill="none" stroke="#C8324B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Account</h1>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 14px; padding: 4px 4px 6px">
<span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 50%; background: var(--chip); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">F</span>
<div><div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">frank</div><div style="font-size: 14px; color: var(--muted)">Admin</div></div>
</div>

<section class="card" aria-labelledby="ap-h">
<h2 id="ap-h" class="label">Appearance</h2>
<div class="seg" role="group" aria-label="Color scheme">
<button type="button" class="{{c.light}}" aria-pressed="{{c.lightP}}" onClick="{{setLight}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Light</button>
<button type="button" class="{{c.dark}}" aria-pressed="{{c.darkP}}" onClick="{{setDark}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>Dark</button>
<button type="button" class="{{c.system}}" aria-pressed="{{c.systemP}}" onClick="{{setSystem}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"></rect><path d="M12 6a6 6 0 0 1 0 12z" fill="currentColor" stroke="none"></path></svg>System</button>
</div>
<p style="margin: 0; font-size: 13px; color: var(--muted)">Saved on this device. Your phone and computer each keep their own.</p>
</section>

<section class="card" aria-label="Account actions" style="padding: 4px 16px">
<a class="rowlink" href="../web/Account.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg><span style="flex: 1">Change password</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true" style="color: var(--muted)"><path d="m9 18 6-6-6-6"></path></svg></a>
<a class="rowlink" href="../web/Devices.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"></rect><path d="M12 18h.01"></path></svg><span style="flex: 1">This phone</span><span style="font-size: 14px; color: var(--muted); font-weight: 500">Paired</span></a>
</section>

<a class="btn" href="../web/SignIn.dc.html">Sign out</a>
</main>

<nav aria-label="App" class="bb">
<a class="bbtn" href="PhoneMenu.dc.html" style="justify-self: start"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>Menu</a>
<a class="scan" href="../mobile-scanner/Scan.dc.html"><span class="fab" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><rect x="12" y="6" width="20" height="36" rx="4"></rect><path d="M19 37h6"></path><path d="M36 18a9 9 0 0 1 0 12M40 14a15 15 0 0 1 0 20"></path></svg></span>Scan</a>
<a class="bbtn on" href="PhoneAccount.dc.html" aria-current="page" style="justify-self: end"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: var(--text); color: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">F</span>frank</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark","system"],"default":"system"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { theme: props.theme || 'system', sysDark: false }; }
  componentDidMount() {
    var self = this;
    try {
      this.mq = window.matchMedia('(prefers-color-scheme: dark)');
      this.onMq = function () { self.setState({ sysDark: self.mq.matches }); };
      this.onMq();
      if (this.mq.addEventListener) this.mq.addEventListener('change', this.onMq);
    } catch (e) {}
  }
  componentWillUnmount() { try { if (this.mq && this.mq.removeEventListener) this.mq.removeEventListener('change', this.onMq); } catch (e) {} }
  renderVals() {
    var self = this, s = this.state;
    var dark = s.theme === 'dark' || (s.theme === 'system' && s.sysDark);
    var cls = function (v) { return s.theme === v ? 'sbtn on' : 'sbtn'; };
    return {
      themeCls: dark ? 'dark' : 'light',
      c: { light: cls('light'), dark: cls('dark'), system: cls('system'), lightP: String(s.theme === 'light'), darkP: String(s.theme === 'dark'), systemP: String(s.theme === 'system') },
      setLight: function () { self.setState({ theme: 'light' }); },
      setDark: function () { self.setState({ theme: 'dark' }); },
      setSystem: function () { self.setState({ theme: 'system' }); }
    };
  }
}
</script>
</body>
</html>
