<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.light{--bg:#F4F2EE;--surface:#FFFFFF;--line:#DDD8CF;--text:#1C1B19;--muted:#5E5A53;--accent:#B45309;--onaccent:#FFFFFF;--chip:#ECE8E1}
.dark{--bg:#121212;--surface:#1C1C1B;--line:#34322E;--text:#F2EFE9;--muted:#A9A49B;--accent:#F59E0B;--onaccent:#1A1205;--chip:#262523}
.item{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:16px;font-weight:600;box-sizing:border-box}
.item.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.item svg{flex:none}
.badge{margin-left:auto;background:var(--accent);color:var(--onaccent);border-radius:999px;font-size:12px;font-weight:700;padding:1px 8px}
.label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bb{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:8px 14px 22px;background:var(--surface);border-top:1px solid var(--line);position:relative}
.bbtn{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:48px;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
.bbtn.on{color:var(--text)}
.scan{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:-30px;font-size:12px;font-weight:700;color:var(--text)}
.scan .fab{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--onaccent);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px var(--surface),0 4px 14px rgba(0,0,0,.25)}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

</nav>

<a class="item" href="#" style="flex-direction: column; justify-content: center; gap: 4px; min-height: 68px; font-size: 14px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"></path></svg>Settings</a>
</nav>
