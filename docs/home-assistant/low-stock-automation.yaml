# Low stock: add the product to the shopping list and notify a phone.
#
# Paste into Home Assistant: Settings > Automations & scenes > Create automation >
# three-dot menu > Edit in YAML, replace everything, then save. Change
# notify.mobile_app_my_phone to your phone's notify action (Developer tools > Actions,
# search "mobile_app"). Then give the automation the "Claude" label (three-dot menu >
# Labels), as every automation made for this project has.
#
# It runs once each time a product goes from not low to low (filament_tracker_low_stock),
# so it adds one item per product rather than one per change of the Low filament sensor.
alias: Filament Tracker - low stock
description: >-
  When Filament Tracker reports a product low on stock, add it to the shopping list
  and send a phone notification.
mode: queued
triggers:
  - trigger: event
    event_type: filament_tracker_low_stock
actions:
  - action: todo.add_item
    target:
      entity_id: todo.shopping_list
    data:
      item: "{{ trigger.event.data.product }} ({{ trigger.event.data.filament_type }})"
      description: >-
        {{ trigger.event.data.sealed }} sealed left; low at
        {{ trigger.event.data.threshold }} or fewer. Color
        {{ trigger.event.data.color }}.
  - action: notify.mobile_app_my_phone
    data:
      title: Filament low
      message: >-
        {{ trigger.event.data.product }}: {{ trigger.event.data.sealed }} sealed left.
        Added to the shopping list.
