# Alembic settings for running migrations from the command line, from server/:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "describe the change"
# The database URL comes from the DATABASE_URL setting. The server also upgrades the
# database on startup.

[alembic]
script_location = filament_tracker:migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
