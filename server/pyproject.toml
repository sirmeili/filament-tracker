[project]
name = "filament-tracker"
version = "0.1.0"
description = "Self-hosted server that tracks Bambu Lab filament spools from delivery to empty"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiomqtt>=2.5.1,<3",
    "alembic>=1.20,<2",
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.162,<1",
    "paho-mqtt>=2.1,<2.2",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<3",
    "uvicorn>=0.54,<1",
]

[project.scripts]
ft-admin = "filament_tracker.admin_cli:main"
ft-sim = "filament_tracker.simulator.cli:main"
ft-fakeprinter = "filament_tracker.simulator.fakeprinter:main"
ft-printer = "filament_tracker.printer.check:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "hypothesis>=6.170,<7",
    "pip-audit>=2.10,<3",
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=filament_tracker --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
